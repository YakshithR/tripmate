<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TripMate | Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary"><div class="container"><a class="navbar-brand fw-bold" href="/">TripMate Admin</a><button id="logoutButton" class="btn btn-outline-light btn-sm d-none">Logout</button></div></nav>
<main class="container py-5">
  <section id="loginPanel" class="row justify-content-center">
    <div class="col-md-5"><div class="card border-0 shadow-sm"><div class="card-body p-4">
      <h1 class="h4 mb-3">Admin login</h1><div id="loginError" class="alert alert-danger d-none"></div>
      <form id="loginForm"><div class="mb-3"><label class="form-label" for="username">Username</label><input id="username" class="form-control" required autocomplete="username"></div>
      <div class="mb-3"><label class="form-label" for="password">Password</label><input id="password" type="password" class="form-control" required autocomplete="current-password"></div>
      <button class="btn btn-primary w-100">Login</button></form>
    </div></div></div>
  </section>

  <section id="dashboard" class="d-none">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2"><div><h1 class="h3 mb-1">Dashboard</h1><p class="text-secondary mb-0">Manage trips and student registrations.</p></div></div>
    <div class="row g-3 mb-4"><div class="col-sm-6 col-lg-3"><div class="card border-0 shadow-sm"><div class="card-body"><div class="text-secondary small">Total registrations</div><div class="display-6 fw-semibold" id="totalRegistrations">0</div></div></div></div></div>
    <div class="card border-0 shadow-sm mb-4"><div class="card-body p-4">
      <h2 class="h5 mb-3">Add a trip</h2><div id="tripMessage" class="alert d-none"></div>
      <form id="tripForm" class="row g-3 align-items-end">
        <div class="col-md-4"><label class="form-label" for="tripName">Trip name</label><input class="form-control" id="tripName" required></div>
        <div class="col-md-4"><label class="form-label" for="destination">Destination</label><input class="form-control" id="destination" required></div>
        <div class="col-md-2"><label class="form-label" for="tripDate">Trip date</label><input class="form-control" type="date" id="tripDate" required></div>
        <div class="col-md-2"><button class="btn btn-primary w-100">Add trip</button></div>
      </form>
    </div></div>
    <div class="card border-0 shadow-sm mb-4"><div class="card-body p-4">
      <h2 class="h5 mb-3">Trips and registrations</h2><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Trip</th><th>Destination</th><th>Date</th><th>Students registered</th></tr></thead><tbody id="tripRows"></tbody></table></div>
    </div></div>
    <div class="card border-0 shadow-sm"><div class="card-body p-4">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3"><h2 class="h5 mb-0">Student registrations</h2><input id="search" class="form-control search-box" placeholder="Search name, class, roll no. or trip"></div>
      <div class="table-responsive"><table class="table table-hover align-middle"><thead><tr><th>Registration ID</th><th>Student</th><th>Class / Section</th><th>Roll no.</th><th>Parent</th><th>Phone</th><th>Trip</th><th>Action</th></tr></thead><tbody id="registrationRows"></tbody></table></div>
      <p id="emptyMessage" class="text-secondary mb-0 d-none">No registrations found.</p>
    </div></div>
  </section>
</main>
<script>
const loginPanel = document.getElementById("loginPanel");
const dashboard = document.getElementById("dashboard");
const loginError = document.getElementById("loginError");
const logoutButton = document.getElementById("logoutButton");
let registrations = [];

function showDashboard() {
  loginPanel.classList.add("d-none");
  dashboard.classList.remove("d-none");
  logoutButton.classList.remove("d-none");
  loadDashboard();
}
async function api(url, options = {}) {
  const response = await fetch(url, { ...options, headers: { "Content-Type": "application/json", ...(options.headers || {}) } });
  const data = await response.json();
  if (!response.ok) throw new Error(data.error || "Request failed.");
  return data;
}
async function checkSession() {
  try { const data = await api("/api/admin/session"); if (data.authenticated) showDashboard(); } catch {}
}
document.getElementById("loginForm").addEventListener("submit", async event => {
  event.preventDefault(); loginError.classList.add("d-none");
  try {
    await api("/api/admin/login", { method: "POST", body: JSON.stringify({
      username: document.getElementById("username").value,
      password: document.getElementById("password").value
    }) });
    showDashboard();
  } catch (error) { loginError.textContent = error.message; loginError.classList.remove("d-none"); }
});
logoutButton.addEventListener("click", async () => {
  await api("/api/admin/logout", { method: "POST" });
  dashboard.classList.add("d-none"); loginPanel.classList.remove("d-none"); logoutButton.classList.add("d-none");
});
async function loadDashboard() {
  try {
    const [summary, rows] = await Promise.all([api("/api/trips/summary"), api("/api/students")]);
    document.getElementById("totalRegistrations").textContent = summary.totalRegistrations;
    document.getElementById("tripRows").innerHTML = summary.trips.map(trip =>
      `<tr><td>${escapeHtml(trip.tripName)}</td><td>${escapeHtml(trip.destination)}</td><td>${new Date(trip.tripDate).toLocaleDateString()}</td><td>${trip.totalStudents}</td></tr>`
    ).join("") || '<tr><td colspan="4" class="text-secondary">No trips added yet.</td></tr>';
    registrations = rows;
    renderRegistrations();
  } catch (error) { alert(error.message); }
}
function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, char => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[char]));
}
function renderRegistrations() {
  const query = document.getElementById("search").value.trim().toLowerCase();
  const filtered = registrations.filter(row => [
    row.registration_id, row.student.student_name, row.student.class_name,
    row.student.section, row.student.roll_number, row.student.parent_name,
    row.student.parent_phone, row.trip.trip_name, row.trip.destination
  ].join(" ").toLowerCase().includes(query));
  document.getElementById("registrationRows").innerHTML = filtered.map(row => `
    <tr>
      <td><small>${escapeHtml(row.registration_id)}</small></td>
      <td>${escapeHtml(row.student.student_name)}</td>
      <td>${escapeHtml(row.student.class_name)} / ${escapeHtml(row.student.section)}</td>
      <td>${escapeHtml(row.student.roll_number)}</td>
      <td>${escapeHtml(row.student.parent_name)}</td>
      <td>${escapeHtml(row.student.parent_phone)}</td>
      <td>${escapeHtml(row.trip.trip_name)}</td>
      <td><button class="btn btn-sm btn-outline-danger" data-delete="${row.id}">Delete</button></td>
    </tr>`).join("");
  document.getElementById("emptyMessage").classList.toggle("d-none", filtered.length > 0);
}
document.getElementById("search").addEventListener("input", renderRegistrations);
document.getElementById("registrationRows").addEventListener("click", async event => {
  const id = event.target.dataset.delete;
  if (!id || !confirm("Delete this registration?")) return;
  try { await api(`/api/students/${id}`, { method: "DELETE" }); await loadDashboard(); }
  catch (error) { alert(error.message); }
});
document.getElementById("tripForm").addEventListener("submit", async event => {
  event.preventDefault();
  const message = document.getElementById("tripMessage");
  try {
    await api("/api/trips", { method: "POST", body: JSON.stringify({
      tripName: document.getElementById("tripName").value,
      destination: document.getElementById("destination").value,
      tripDate: document.getElementById("tripDate").value
    }) });
    message.textContent = "Trip added successfully.";
    message.className = "alert alert-success";
    event.target.reset();
    await loadDashboard();
  } catch (error) { message.textContent = error.message; message.className = "alert alert-danger"; }
});
checkSession();
</script>
</body>
</html>
