<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TripMate | School Trip Registration</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary">
  <div class="container"><a class="navbar-brand fw-bold" href="/">TripMate</a><a class="btn btn-outline-light btn-sm" href="/admin">Admin</a></div>
</nav>
<main class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-7">
      <div class="card border-0 shadow-sm">
        <div class="card-body p-4 p-md-5">
          <h1 class="h3 mb-2">School Trip Registration</h1>
          <p class="text-secondary mb-4">Enter the student and parent details to register for a trip.</p>
          <div id="message" class="alert d-none" role="alert"></div>
          <form id="registrationForm">
            <div class="mb-3"><label class="form-label" for="studentName">Student name</label><input class="form-control" id="studentName" required maxlength="100"></div>
            <div class="row">
              <div class="col-md-4 mb-3"><label class="form-label" for="className">Class</label><input class="form-control" id="className" required maxlength="30" placeholder="e.g. 8"></div>
              <div class="col-md-4 mb-3"><label class="form-label" for="section">Section</label><input class="form-control" id="section" required maxlength="10" placeholder="e.g. A"></div>
              <div class="col-md-4 mb-3"><label class="form-label" for="rollNumber">Roll number</label><input class="form-control" id="rollNumber" required maxlength="30"></div>
            </div>
            <div class="mb-3"><label class="form-label" for="parentName">Parent name</label><input class="form-control" id="parentName" required maxlength="100"></div>
            <div class="mb-3"><label class="form-label" for="parentPhone">Parent phone</label><input class="form-control" id="parentPhone" type="tel" inputmode="numeric" pattern="[0-9]{7,15}" required></div>
            <div class="mb-4"><label class="form-label" for="tripId">Trip destination</label><select class="form-select" id="tripId" required><option value="">Loading trips...</option></select></div>
            <button class="btn btn-primary w-100" type="submit" id="submitButton">Register for Trip</button>
          </form>
          <div id="successDetails" class="alert alert-success mt-4 d-none"></div>
        </div>
      </div>
    </div>
  </div>
</main>
<script>
const form = document.getElementById("registrationForm");
const message = document.getElementById("message");
const tripSelect = document.getElementById("tripId");
const successDetails = document.getElementById("successDetails");

async function loadTrips() {
  try {
    const response = await fetch("/api/trips");
    const trips = await response.json();
    tripSelect.innerHTML = '<option value="">Select a trip</option>';
    trips.forEach(trip => {
      const option = document.createElement("option");
      option.value = trip.id;
      option.textContent = `${trip.trip_name} — ${trip.destination} (${new Date(trip.trip_date).toLocaleDateString()})`;
      tripSelect.appendChild(option);
    });
    if (!trips.length) tripSelect.innerHTML = '<option value="">No trips are available yet</option>';
  } catch {
    tripSelect.innerHTML = '<option value="">Could not load trips</option>';
  }
}

form.addEventListener("submit", async event => {
  event.preventDefault();
  message.classList.add("d-none");
  successDetails.classList.add("d-none");
  const button = document.getElementById("submitButton");
  button.disabled = true;
  button.textContent = "Registering...";
  const payload = {
    studentName: document.getElementById("studentName").value,
    className: document.getElementById("className").value,
    section: document.getElementById("section").value,
    rollNumber: document.getElementById("rollNumber").value,
    parentName: document.getElementById("parentName").value,
    parentPhone: document.getElementById("parentPhone").value,
    tripId: tripSelect.value
  };
  try {
    const response = await fetch("/api/students/register", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload)
    });
    const result = await response.json();
    if (!response.ok) throw new Error(result.error || "Registration failed.");
    successDetails.textContent = `Registration successful! Your registration ID is ${result.registrationId}. Trip: ${result.tripName}.`;
    successDetails.classList.remove("d-none");
    form.reset();
  } catch (error) {
    message.textContent = error.message;
    message.className = "alert alert-danger";
  } finally {
    button.disabled = false;
    button.textContent = "Register for Trip";
  }
});

loadTrips();
</script>
</body>
</html>
