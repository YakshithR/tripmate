services:
  db:
    image: postgres:16-alpine
    container_name: tripmate-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tripmate}
      POSTGRES_USER: ${POSTGRES_USER:-tripmate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tripmate_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tripmate} -d ${POSTGRES_DB:-tripmate}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: tripmate-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tripmate}:${POSTGRES_PASSWORD:-tripmate_dev_password}@db:5432/${POSTGRES_DB:-tripmate}?schema=public
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
